<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="강단노트">
<meta name="theme-color" content="#F4EFE6">
<meta name="description" content="설교 원고 PDF를 아이패드에서 읽고, 애플펜슬로 표시하고, 강단에서 넘겨 보는 리더">
<title>강단노트</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
/* 제목 글꼴은 앱에 넣어 둔다(오프라인 · 외부 요청 없음). 고운바탕, SIL OFL 1.1 */
@font-face{font-family:"Gowun Batang";src:url("fonts/GowunBatang-Regular.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Gowun Batang";src:url("fonts/GowunBatang-Bold.woff2") format("woff2");font-weight:700;font-display:swap}
:root{
  --paper:#F4EFE6; --paper-2:#EBE4D6; --card:#FBF8F2;
  --ink:#2A241D; --ink-2:#6E6356; --ink-3:#A0968A; --line:#DCD2C1;
  --accent:#7C2433; --accent-soft:#F1E1E0; --gold:#B0843A;
  --desk:#E4DED3; --bar:rgba(247,243,236,.86); --bar-solid:#F7F3EC;
  --ok:#3F7D58; --warn:#C98A1B; --over:#B3261E;
  --serif:"Gowun Batang","AppleMyungjo","Nanum Myeongjo",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:var(--sans);
  -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
body{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
[hidden]{display:none!important}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.view{position:fixed;inset:0;display:flex;flex-direction:column}

/* ─────────── 서재 ─────────── */
#library{overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:calc(28px + var(--safe-t)) calc(28px + var(--safe-r)) calc(40px + var(--safe-b)) calc(28px + var(--safe-l))}
.lib-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;
  max-width:1180px;width:100%;margin:0 auto 28px;padding-bottom:22px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:16px}
.brand-mark{width:54px;height:54px;border-radius:14px;flex:none;box-shadow:0 6px 16px -8px rgba(124,36,51,.6)}
.brand h1{font-family:var(--serif);font-weight:700;font-size:30px;letter-spacing:-.01em;margin:0}
.brand p{margin:4px 0 0;color:var(--ink-2);font-size:14.5px}
.lib-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.search{display:flex;align-items:center;gap:8px;height:44px;padding:0 14px;border:1px solid var(--line);
  border-radius:12px;background:var(--card);color:var(--ink-3)}
.search input{border:0;outline:0;background:none;font:inherit;font-size:15px;color:var(--ink);width:150px}
.btn{height:44px;padding:0 18px;border-radius:12px;font-size:15px;font-weight:600;display:inline-flex;
  align-items:center;gap:8px;border:1px solid var(--line);background:var(--card)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 8px 18px -10px rgba(124,36,51,.8)}
.btn.primary:active{transform:translateY(1px)}
.btn.danger{background:var(--over);border-color:var(--over);color:#fff}
.grid{max-width:1180px;width:100%;margin:0 auto;display:grid;gap:26px 22px;
  grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.card{position:relative;text-align:left;display:flex;flex-direction:column;gap:12px;animation:rise .4s both}
.card .sheet{position:relative;aspect-ratio:3/3.6;border-radius:6px;overflow:hidden;background:#fff;
  box-shadow:0 1px 0 rgba(0,0,0,.04),0 12px 28px -18px rgba(60,40,20,.55),0 2px 6px -3px rgba(60,40,20,.2);
  transition:transform .18s ease,box-shadow .18s ease}
.card .sheet img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.card .sheet::after{content:"";position:absolute;inset:auto 0 0 0;height:34%;
  background:linear-gradient(to top,rgba(251,248,242,.95),rgba(251,248,242,0))}
.card:active .sheet{transform:scale(.985)}
.card .badge{position:absolute;right:10px;bottom:10px;z-index:1;font-size:12px;font-weight:600;color:var(--accent);
  background:var(--accent-soft);padding:4px 8px;border-radius:999px;display:flex;gap:4px;align-items:center}
.card .badge svg{width:13px;height:13px}
.card .meta{font-size:12.5px;color:var(--ink-2);display:flex;gap:6px;align-items:center;letter-spacing:.01em}
.card .meta b{color:var(--gold);font-weight:700}
.card h3{font-family:var(--serif);font-size:18px;line-height:1.35;margin:0;font-weight:700;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .sub{font-size:12.5px;color:var(--ink-3);margin-top:-6px}
.card .more{position:absolute;top:6px;right:6px;z-index:2;width:36px;height:36px;border-radius:10px;
  display:grid;place-items:center;background:rgba(251,248,242,.94);color:var(--ink-2)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.empty{max-width:560px;margin:8vh auto 0;text-align:center;color:var(--ink-2)}
.empty .art{width:120px;height:120px;margin:0 auto 18px;opacity:.9}
.empty h2{font-family:var(--serif);color:var(--ink);font-size:24px;margin:0 0 10px}
.empty p{line-height:1.7;margin:0 0 22px;font-size:15px}
.lib-foot{max-width:1180px;width:100%;margin:40px auto 0;padding-top:18px;border-top:1px solid var(--line);
  color:var(--ink-3);font-size:13px;line-height:1.7}
.lib-foot b{color:var(--ink-2)}
.dropzone{position:fixed;inset:14px;border:2px dashed var(--accent);border-radius:22px;background:rgba(244,239,230,.92);
  display:grid;place-items:center;font-family:var(--serif);font-size:24px;color:var(--accent);z-index:60;pointer-events:none}

/* ─────────── 리더 ─────────── */
#reader{background:var(--desk)}
.rbar{flex:none;display:flex;align-items:center;gap:10px;z-index:5;
  padding:calc(8px + var(--safe-t)) calc(12px + var(--safe-r)) 8px calc(12px + var(--safe-l));
  background:var(--bar); /* 흐림(backdrop-filter)은 뺐다 — 뒤로 지나가는 것이 없어 보이는 차이 없이 그래픽 일만 늘렸다 */
  border-bottom:1px solid rgba(0,0,0,.06)}
.icon-btn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--ink);flex:none}
.icon-btn:active{background:rgba(0,0,0,.06)}
.rtitle{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.rtitle b{font-family:var(--serif);font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rtitle span{font-size:12px;color:var(--ink-2)}
.seg{display:flex;background:rgba(0,0,0,.06);border-radius:12px;padding:3px;flex:none}
.seg button{height:38px;padding:0 16px;border-radius:9px;font-size:14.5px;font-weight:600;color:var(--ink-2);
  display:flex;align-items:center;gap:6px}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg svg.i{width:17px;height:17px}

.scroller{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;position:relative;
  touch-action:pan-x pan-y;overscroll-behavior:contain;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.pages{display:flex;flex-direction:column;align-items:center;gap:var(--gap,14px);
  padding:16px calc(12px + var(--safe-r)) 45vh calc(12px + var(--safe-l))}
.page{position:relative;background:#fff;flex:none;box-shadow:0 1px 2px rgba(0,0,0,.08),0 10px 24px -16px rgba(40,30,20,.45)}
.page canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.page canvas.ink{mix-blend-mode:multiply;touch-action:pan-x pan-y}
.page .pno{position:absolute;right:8px;bottom:6px;font-size:11px;color:#b9b0a4;font-variant-numeric:tabular-nums;pointer-events:none}
.guide{position:absolute;left:0;right:0;height:0;pointer-events:none;opacity:0;z-index:3}
.guide::before{content:"";position:absolute;left:10px;right:10px;top:-1px;height:2px;border-radius:2px;
  background:linear-gradient(90deg,var(--gold),rgba(176,132,58,.15))}
.guide::after{content:"";position:absolute;left:2px;top:-7px;border:7px solid transparent;border-left:9px solid var(--gold)}
.guide.show{animation:guide 2.4s ease-out}
@keyframes guide{0%{opacity:0}8%{opacity:1}70%{opacity:1}100%{opacity:0}}

/* 화면 테마 */
#reader[data-theme="sepia"]{--desk:#D8CCB4}
#reader[data-theme="sepia"] .page{filter:sepia(.32) brightness(.98)}
#reader[data-theme="dark"]{--desk:#121110;--bar:rgba(28,26,24,.88);--bar-solid:#1C1A18}
#reader[data-theme="dark"] .page{filter:invert(.9) hue-rotate(180deg);box-shadow:none}
#reader[data-theme="dark"] .rbar{color:#E9E3D8;border-color:rgba(255,255,255,.06)}
#reader[data-theme="dark"] .icon-btn,#reader[data-theme="dark"] .rtitle span{color:#CFC7BA}
#reader[data-theme="dark"] .seg{background:rgba(255,255,255,.08)}
#reader[data-theme="dark"] .seg button{color:#B8AFA2}
#reader[data-theme="dark"] .seg button.on{background:#3A3632;color:#fff}

/* 도구 팔레트 */
.palette{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(16px + var(--safe-b));z-index:6;
  display:flex;align-items:center;gap:4px;padding:6px;border-radius:18px;background:var(--bar-solid); /* 흐림 없이 불투명 — 필기·스크롤 매 장면 다시 흐리던 일 덜기 */
  box-shadow:0 14px 34px -14px rgba(40,30,20,.5),0 0 0 1px rgba(0,0,0,.05);max-width:calc(100% - 20px)}
.palette .sep{width:1px;height:28px;background:rgba(0,0,0,.1);margin:0 4px}
.tool{width:48px;height:48px;border-radius:13px;display:grid;place-items:center;color:var(--ink-2);position:relative}
.tool.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.tool .tip{position:absolute;left:12px;right:12px;bottom:8px;height:4px;border-radius:2px;background:var(--c,transparent)}
.tool:disabled{opacity:.3}
.swatches{display:flex;gap:2px}
.sw{width:40px;height:40px;border-radius:50%;display:grid;place-items:center}
.sw i{width:22px;height:22px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);transition:transform .12s}
.sw.on i{transform:scale(1.18);box-shadow:0 0 0 2px #fff,0 0 0 4px var(--c)}
.size{width:44px;height:44px;border-radius:12px;display:grid;place-items:center}
.size i{display:block;border-radius:50%;background:var(--ink-2)}
.tool.finger.on{background:var(--accent-soft);color:var(--accent);box-shadow:none}
#reader[data-mode="pulpit"] .palette{display:none}
.opts{display:flex;align-items:center}
.emode{display:flex;background:rgba(0,0,0,.06);border-radius:11px;padding:3px;gap:2px}
.emode button{height:38px;padding:0 12px;border-radius:8px;font-size:14px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.emode button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.opts .hint{font-size:13.5px;color:var(--ink-2);padding:0 10px;white-space:nowrap}
.size i{box-sizing:border-box}

/* 굵기 슬라이더 */
.sizepop{display:flex;align-items:center;gap:14px;padding:4px 8px 10px;width:300px;max-width:calc(100vw - 40px)}
.sizepop .prev{width:64px;height:64px;flex:none;display:grid;place-items:center;border-radius:12px;background:#fff;
  box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
.sizepop .prev i{display:block;box-sizing:border-box}
.sizepop input{flex:1;min-width:0;-webkit-appearance:none;appearance:none;height:36px;background:transparent;margin:0}
.sizepop input::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(90deg,#E4DACB,#B9AC98)}
.sizepop input::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;margin-top:-11px;border-radius:50%;
  background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.3),0 0 0 1px rgba(0,0,0,.06)}
.sizepop input::-moz-range-track{height:6px;border-radius:3px;background:#D6CBB8}
.sizepop input::-moz-range-thumb{width:26px;height:26px;border:0;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.3)}

/* 올가미·선택·지우개 커서 */
.lasso{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2;overflow:visible}
.lasso polygon{fill:rgba(124,36,51,.06);stroke:var(--accent);stroke-width:1.6;stroke-dasharray:6 5;stroke-linejoin:round}
.page canvas.float{pointer-events:none;will-change:transform}
.selbox{position:absolute;z-index:2;border:1.5px dashed var(--accent);border-radius:8px;background:rgba(124,36,51,.05);pointer-events:none}
.selbar{position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%);display:flex;align-items:center;gap:2px;
  padding:4px 4px 4px 12px;border-radius:12px;background:#2A241D;color:#F4EFE6;pointer-events:auto;white-space:nowrap;
  box-shadow:0 10px 24px -10px rgba(0,0,0,.55);font-size:13.5px}
.selbox.below .selbar{bottom:auto;top:calc(100% + 8px)}
.selbar .cnt{color:#CFC5B6;margin-right:6px}
.selbar button{height:36px;padding:0 10px;border-radius:9px;display:flex;align-items:center;gap:6px;font-size:14px;color:#F4EFE6}
.selbar button:active{background:rgba(255,255,255,.14)}
.selbar svg.i{width:17px;height:17px}
.ecur{position:absolute;z-index:3;border-radius:50%;border:1.5px solid rgba(40,30,20,.6);background:rgba(255,255,255,.35);
  box-shadow:0 0 0 1px rgba(255,255,255,.7);pointer-events:none}

/* 강단 상태(같은 막대 안) — 준비·강단 버튼과 메뉴는 두 모드에서 같은 자리 */
.rbar{position:relative}
#reader[data-mode="prep"] .pulpit-only{display:none!important}
#reader[data-mode="pulpit"] .prep-only{display:none!important}
.pstat{flex:1;min-width:0;display:flex;align-items:center;gap:4px}
.pstat .grow{flex:1}
.rbar .pill{height:40px;padding:0 11px;border-radius:11px;display:flex;align-items:center;gap:7px;font-size:15px;
  font-variant-numeric:tabular-nums;white-space:nowrap;flex:none}
.rbar .pill:active{background:rgba(0,0,0,.06)}
.pstat .clock{color:var(--ink-2)}
#reader[data-theme="dark"] .pstat .clock{color:#B8AFA2}
/* 타이머: 상태마다 색 — 대기 검정, 진행 버건디 → 막바지 주황 → 넘김 빨강, 멈춤 회색 */
.timer{gap:7px;padding:0 13px!important;--tc:var(--ink)}
.timer .tt{font-size:21px;font-weight:800;letter-spacing:.02em;color:var(--tc)}
.timer small{font-size:12px;font-weight:600;color:var(--tc);opacity:.85}
.timer .dot{width:9px;height:9px;border-radius:50%;background:var(--tc);opacity:.5}
.timer.run .dot{opacity:1}
.timer.run{--tc:var(--accent)}.timer.warn{--tc:var(--warn)}.timer.over{--tc:#D93025}.timer.paused{--tc:var(--ink-2)}
#reader[data-theme="dark"] .timer{--tc:#F1EBE1}
#reader[data-theme="dark"] .timer.run{--tc:#E8909E}#reader[data-theme="dark"] .timer.warn{--tc:#F2B84B}
#reader[data-theme="dark"] .timer.over{--tc:#FF7A6E}#reader[data-theme="dark"] .timer.paused{--tc:#B8AFA2}
.tset{font-size:14px!important;color:var(--ink-2);border:1px solid rgba(0,0,0,.12)}
.tset svg.i{width:17px;height:17px}
#reader[data-theme="dark"] .tset{border-color:rgba(255,255,255,.16);color:#B8AFA2}
/* 진행 막대: 폭 애니메이션은 매 프레임 다시 그려 발열이 컸다 → 늘어날 때만 transform 으로 한 번씩 */
.tprog{position:absolute;left:0;bottom:-1px;height:3px;width:100%;background:var(--accent);transform:scaleX(0);transform-origin:0 50%;transition:background .4s}
.tprog.warn{background:var(--warn)}.tprog.over{background:#D93025}
.wake{color:var(--ok)}.wake.off{color:var(--ink-3)}
/* 타이머 설정 창 */
.tpop{padding:4px 8px 10px;width:330px;max-width:calc(100vw - 40px)}
.tpop .tmode{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:4px 0 2px}
.tpop .tmode button{display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 4px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--ink-2)}
.tpop .tmode b{font-size:15px;font-weight:700}.tpop .tmode small{font-size:12px;color:var(--ink-3)}
.tpop .tmode button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.tpop .tmode button.on small{color:var(--accent);opacity:.8}
.tpop .cap{font-size:12.5px;color:var(--ink-3);text-align:center;margin:12px 0 0}
.tpop .dial{display:flex;align-items:center;justify-content:center;gap:6px;margin:4px 0 12px}
.tpop .dial b{min-width:108px;text-align:center;font-size:34px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--ink)}
.tpop .dial b small{font-size:16px;font-weight:600;margin-left:2px}
.tpop .dial button{width:46px;height:46px;border-radius:12px;border:1px solid var(--line);font-size:15px;font-weight:700;background:#fff}
.tpop .chips{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:12px}
.tpop .chips button{height:38px;border-radius:10px;border:1px solid var(--line);font-size:14px;background:#fff}
.tpop .chips button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
.tpop .row{display:flex;gap:8px}
.tpop .row .btn{flex:1;justify-content:center}
.tpop .note{font-size:12.5px;color:var(--ink-3);margin:10px 2px 0;line-height:1.5}

/* 메뉴·팝오버 */
.menu{position:absolute;z-index:20;min-width:260px;padding:8px;border-radius:16px;background:#FBF8F2;color:var(--ink);
  box-shadow:0 22px 50px -18px rgba(30,20,10,.55),0 0 0 1px rgba(0,0,0,.06);animation:pop .14s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(-4px) scale(.98)}}
.menu .mi{width:100%;min-height:46px;padding:0 12px;border-radius:10px;display:flex;align-items:center;gap:12px;font-size:15px;text-align:left}
.menu .mi:active{background:rgba(0,0,0,.05)}
.menu .mi .r{margin-left:auto;color:var(--ink-3);font-size:13px}
.menu .mi.danger{color:var(--over)}
.menu hr{border:0;border-top:1px solid var(--line);margin:6px 4px}
.menu .lbl{font-size:12px;color:var(--ink-3);padding:6px 12px 2px}
.menu .themes{display:flex;gap:6px;padding:4px 8px 8px}
.menu .themes button{flex:1;height:40px;border-radius:10px;font-size:14px;border:1px solid var(--line)}
.menu .themes button.on{border-color:var(--accent);color:var(--accent);font-weight:700;background:var(--accent-soft)}
.toggle{width:44px;height:26px;border-radius:13px;background:#D6CDBF;position:relative;margin-left:auto;transition:background .15s;flex:none}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;
  box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.toggle.on{background:var(--accent)}.toggle.on::after{transform:translateX(18px)}
.pages-pop{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:6px}
.pages-pop button{height:44px;border-radius:10px;border:1px solid var(--line);font-size:15px;font-variant-numeric:tabular-nums}
.pages-pop button.on{background:var(--accent);border-color:var(--accent);color:#fff}

/* 모달·토스트·로딩 */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(30,24,18,.38);display:grid;place-items:center;padding:20px;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.dialog{width:min(420px,100%);background:#FBF8F2;border-radius:20px;padding:24px;box-shadow:0 30px 60px -20px rgba(0,0,0,.5)}
.dialog h3{font-family:var(--serif);font-size:21px;margin:0 0 8px}
.dialog p{margin:0 0 20px;color:var(--ink-2);line-height:1.65;font-size:15px;word-break:keep-all;white-space:pre-line}
.dialog .row{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(96px + var(--safe-b));transform:translateX(-50%);z-index:70;
  background:rgba(34,29,24,.94);color:#F4EFE6;padding:12px 18px;border-radius:14px;font-size:14.5px;
  max-width:calc(100% - 40px);text-align:center;line-height:1.5;pointer-events:none;animation:fade .2s}
.busy{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:rgba(244,239,230,.7);backdrop-filter:blur(3px)}
.busy div{background:#FBF8F2;padding:18px 24px;border-radius:16px;box-shadow:0 20px 40px -20px rgba(0,0,0,.4);
  display:flex;gap:12px;align-items:center;font-size:15px;max-width:80vw}
.busy .btn{height:34px;padding:0 14px;font-size:14px;margin-left:6px;flex:none}
.spin{width:20px;height:20px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}

/* 본문 영역: 왼쪽 쪽 미리보기 + 원고 */
.rbody{flex:1;min-height:0;display:flex}
.rbody .scroller{flex:1;min-width:0;height:100%}
.scroller.zoomed{overflow-x:auto;touch-action:pan-x pan-y}
.scroller.zoomed .pages{margin:0 auto}
.thumbs{flex:none;width:150px;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 12px calc(120px + var(--safe-b)) calc(12px + var(--safe-l));
  background:var(--paper-2);border-right:1px solid var(--line)}
.th{display:block;width:100%;margin:0 0 14px;text-align:center}
.th .thc{position:relative;display:block;width:100%;background:#fff;border-radius:4px;overflow:hidden;
  box-shadow:0 1px 2px rgba(0,0,0,.1),0 6px 14px -10px rgba(40,30,20,.5)}
.th canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.th canvas.ti{mix-blend-mode:multiply}
.th small{display:block;margin-top:5px;font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.th.on .thc{outline:3px solid var(--accent);outline-offset:2px}
.th.on small{color:var(--accent);font-weight:700}
#reader[data-theme="dark"] .thumbs{background:#1A1816;border-color:#2A2724}
#reader[data-theme="dark"] .th .thc{filter:invert(.9) hue-rotate(180deg)}
#reader[data-theme="sepia"] .th .thc{filter:sepia(.32) brightness(.98)}
#btnThumbs.on{background:var(--accent-soft);color:var(--accent)}
/* 메뉴: 확대·축소 줄 */
.zoomrow{display:flex;align-items:center;gap:6px;min-height:50px;padding:0 8px 0 12px;font-size:15px}
.zoomrow>svg{margin-right:6px}
.zoomrow span{flex:1}
.zoomrow button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:18px;font-weight:700}
.zoomrow button.fit{width:auto;padding:0 10px;font-size:13px;font-weight:600}
.zoomrow b{min-width:52px;text-align:center;font-variant-numeric:tabular-nums}
/* 굵기: pt 숫자 */
.size{width:auto!important;padding:0 8px;gap:6px;display:flex!important;align-items:center}
.size em{font-style:normal;font-size:12px;font-weight:600;color:var(--ink-2);font-variant-numeric:tabular-nums;min-width:22px;text-align:left}
.sizepop .szcol{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.szrow{display:flex;align-items:center;justify-content:center;gap:10px}
.szrow button{width:40px;height:36px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:18px;font-weight:700}
.szrow b{min-width:92px;text-align:center;font-size:16px;font-variant-numeric:tabular-nums}
/* 선택 상자 크기 손잡이 */
.selhandle{position:absolute;right:-13px;bottom:-13px;width:26px;height:26px;border-radius:50%;background:#fff;border:2.5px solid var(--accent);
  box-shadow:0 2px 6px rgba(0,0,0,.25);pointer-events:auto;touch-action:none;cursor:nwse-resize}
.selhandle::before,.selrot::before{content:"";position:absolute;inset:-12px;border-radius:50%}
.selrot{position:absolute;left:-15px;bottom:-15px;width:30px;height:30px;border-radius:50%;background:#fff;border:2.5px solid var(--accent);
  display:grid;place-items:center;color:var(--accent);box-shadow:0 2px 6px rgba(0,0,0,.25);pointer-events:auto;touch-action:none;cursor:grab}
.selrot svg.i{width:16px;height:16px;stroke-width:2.4}
.selbox{transform-origin:center}
.selbox.sel-active .selbar,.selbox.sel-active .selhandle,.selbox.sel-active .selrot{visibility:hidden}
.selangle{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#2A241D;color:#fff;font-size:14px;font-weight:700;
  padding:4px 10px;border-radius:9px;pointer-events:none;font-variant-numeric:tabular-nums}
.selbar .cnt{font-size:13px}

/* 서재: 여러 원고 고르기 */
.card{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.card .pick{position:absolute;top:10px;left:10px;z-index:2;width:32px;height:32px;border-radius:50%;display:none;place-items:center;
  border:2px solid #fff;background:rgba(42,36,29,.22);box-shadow:0 1px 5px rgba(0,0,0,.28);color:#fff}
.card .pick svg{width:18px;height:18px;stroke-width:2.6;opacity:0}
#library.selecting .card .pick{display:grid}
#library.selecting .card .more{display:none}
.card.picked .pick{background:var(--accent)}
.card.picked .pick svg{opacity:1}
.card.picked .sheet{outline:3px solid var(--accent);outline-offset:3px}
#library.selecting{padding-bottom:calc(120px + var(--safe-b))}
.libbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + var(--safe-b));z-index:30;display:flex;align-items:center;gap:4px;
  padding:7px 7px 7px 18px;border-radius:18px;background:#2A241D;color:#F4EFE6;box-shadow:0 18px 40px -14px rgba(0,0,0,.6);
  max-width:calc(100% - 24px);animation:barIn .2s ease-out}
@keyframes barIn{from{opacity:0;transform:translate(-50%,10px)}}
.libbar .cnt{font-size:15px;font-weight:600;margin-right:8px;white-space:nowrap}
.libbar button{height:44px;padding:0 14px;border-radius:12px;font-size:15px;color:#F4EFE6;white-space:nowrap}
.libbar button:active{background:rgba(255,255,255,.12)}
.libbar .del{background:var(--over);font-weight:600}
.libbar .del:disabled{opacity:.35}
.libbar .done{background:#F4EFE6;color:#2A241D;font-weight:700}
@media (max-width:640px){ .libbar .cnt{display:none} #btnSelect{padding:0 12px} }

/* 서재 추가 요소 */
.lib-actions .seg.sort button{height:38px;padding:0 13px;font-size:14px}
.gear{color:var(--ink-2)}
.empty-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:14px}
.linkbtn{color:var(--accent);font-size:14px;font-weight:600;text-decoration:underline;text-underline-offset:3px;padding:6px 2px}
.lib-foot .linkbtn{font-size:13px;margin-left:6px;padding:0}
.field{width:100%;height:48px;border:1px solid var(--line);border-radius:12px;padding:0 14px;font:inherit;font-size:16px;
  background:#fff;color:var(--ink);margin:0 0 18px;outline:none}
.field:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

/* 설정 창 */
.sheet-card{width:min(560px,100%);max-height:min(86vh,760px);display:flex;flex-direction:column;background:#FBF8F2;
  border-radius:22px;box-shadow:0 30px 60px -20px rgba(0,0,0,.5);overflow:hidden;animation:pop .16s ease-out}
.sheet-card header{display:flex;align-items:center;justify-content:space-between;padding:14px 12px 8px 24px}
.sheet-card h3{font-family:var(--serif);font-size:22px;margin:0}
.sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px 22px}
.sgroup-t{font-size:12.5px;font-weight:700;color:var(--ink-3);letter-spacing:.04em;padding:16px 8px 6px}
.srow{width:100%;display:flex;align-items:center;gap:14px;padding:12px;border-radius:14px;text-align:left;background:#fff;
  box-shadow:0 0 0 1px var(--line);margin-bottom:8px}
.srow:active{background:var(--paper-2)}
.srow>.i{color:var(--accent)}
.srow .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.srow b{font-size:15.5px;font-weight:600}
.srow small{font-size:13px;color:var(--ink-2)}
.srow .chev{color:var(--ink-3);width:18px;height:18px}
.snote{font-size:13px;color:var(--ink-2);line-height:1.65;margin:4px 8px 0;word-break:keep-all}
.slead{font-size:15px;color:var(--ink);line-height:1.75;margin:4px 8px 14px;word-break:keep-all}
.sver{font-size:12.5px;color:var(--ink-3);text-align:center;margin:22px 0 0}
.ptitle{display:block;font-size:15px;margin:10px 8px 2px;color:var(--accent)}
.howto{display:flex;gap:14px;align-items:baseline;padding:13px 14px;margin:0 0 8px;background:#fff;border-radius:14px;box-shadow:0 0 0 1px var(--line)}
.howto b{flex:none;width:72px;font-size:15px}
.howto span{font-size:15px;color:var(--ink);line-height:1.5}
.lic{display:flex;flex-direction:column;gap:2px;padding:12px 14px;margin:0 0 8px;background:#fff;border-radius:14px;box-shadow:0 0 0 1px var(--line)}
.lic b{font-size:15px}.lic span{font-size:13.5px;color:var(--accent);font-weight:600}.lic small{font-size:13px;color:var(--ink-2)}

/* 첫 사용 안내 */
.coach{position:absolute;left:50%;transform:translateX(-50%);top:calc(74px + var(--safe-t));z-index:7;width:min(520px,calc(100% - 28px));
  display:flex;align-items:center;gap:14px;padding:14px 14px 14px 18px;border-radius:16px;background:#2A241D;color:#F4EFE6;
  box-shadow:0 18px 40px -16px rgba(0,0,0,.6);animation:coachIn .3s both}
@keyframes coachIn{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
.coach div{flex:1;display:flex;flex-direction:column;gap:3px;line-height:1.5;word-break:keep-all}
.coach b{font-size:15px}.coach span{font-size:13.5px;color:#D8CFC2}
.coach .btn{height:40px;flex:none}
#reader[data-mode="pulpit"] .coach{display:none}

@media (max-width:640px){
  #library{padding-left:calc(18px + var(--safe-l));padding-right:calc(18px + var(--safe-r))}
  .grid{grid-template-columns:repeat(2,1fr);gap:22px 14px}
  .search input{width:110px}
  .tool{width:42px;height:44px}.sw{width:34px}.size{width:36px}
  .seg button{padding:0 11px}
  .pstat .clock{display:none}
  .tset span,.pstat .wake,.timer small{display:none}
  .thumbs{width:112px}
}
@media (max-width:480px){ .palette .size,.palette .sep.s2,.opts .hint{display:none} }
@media (max-width:760px){ .opts .hint{display:none} }
/* 강단 막대: 아이패드 미니 세로(744)·11인치 세로(820·834)에서도 한 줄에 */
@media (max-width:860px){ #reader[data-mode="pulpit"] .rbar{gap:6px} #reader[data-mode="pulpit"] .rbar .pill{padding:0 8px} #reader[data-mode="pulpit"] .seg svg.i{display:none} #reader[data-mode="pulpit"] .seg button{padding:0 12px} }
/* 자동 스크롤(강단): 위쪽 막대의 '자동' 버튼 → 막대 바로 아래 오른쪽에 조절판. 흐림 없이 불투명 */
.autobox{position:fixed;right:calc(12px + var(--safe-r));top:calc(70px + var(--safe-t));z-index:30}
.autopill{position:relative;color:var(--ink-2);border:1px solid rgba(0,0,0,.12)}
.autopill .albl{font-size:14px}
.autopill .adot{position:absolute;right:4px;top:4px;width:8px;height:8px;border-radius:50%;background:var(--ink-3);display:none}
.autopill.on{color:var(--accent);border-color:currentColor}
.autopill.on .adot{display:block}
.autopill.run .adot{background:var(--ok)}
.autopanel{display:flex;align-items:center;gap:2px;padding:5px;border-radius:16px;background:var(--bar-solid);color:var(--ink);
  box-shadow:0 14px 34px -14px rgba(40,30,20,.5),0 0 0 1px rgba(0,0,0,.05)}
.autopanel[hidden]{display:none}
.ab{height:40px;min-width:40px;padding:0 8px;border-radius:11px;display:flex;align-items:center;justify-content:center;gap:5px;font-size:14px;color:inherit}
.ab:active{background:rgba(0,0,0,.06)}
.ab svg.i{width:19px;height:19px}
.aspd{min-width:66px;text-align:center;font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.afit{color:var(--ink-2);font-size:13.5px}
#reader[data-theme="dark"] .autopanel{color:#E9E3D8;box-shadow:0 0 0 1px rgba(255,255,255,.08)}
#reader[data-theme="dark"] .autopill{color:#B8AFA2;border-color:rgba(255,255,255,.16)}
#reader[data-theme="dark"] .autopill.on{color:#E8909E;border-color:currentColor}
@media (max-width:760px){ #reader[data-mode="pulpit"] .autopill .albl{display:none} } /* 아이패드 미니 세로만 그림만 */
</style>

    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-timer" viewBox="0 0 24 24"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 9.5v4l2.5 2"/><path d="M9.5 2.5h5"/><path d="M12 2.5V6"/></symbol>
    <symbol id="i-side" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="15" rx="2"/><path d="M9 4.5v15"/><path d="M5.5 8h1.5M5.5 11h1.5M5.5 14h1.5"/></symbol>
    <symbol id="i-zoom" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M20 20l-4.8-4.8M8 10.5h5M10.5 8v5"/></symbol>
    <symbol id="i-rotate" viewBox="0 0 24 24"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3"/><path d="M19.5 4.5v4h-4"/></symbol>
    <symbol id="i-chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
    <symbol id="i-scroll" viewBox="0 0 24 24"><path d="M5 5h14M5 9h14M5 13h8"/><path d="M17.5 13v7"/><path d="M15 17.5l2.5 2.5 2.5-2.5"/></symbol>
    <symbol id="i-pages" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/></symbol>
  </defs>
</svg>

<!-- 서재 -->
<section id="library" class="view">
  <header class="lib-head">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true">
        <rect width="64" height="64" rx="16" fill="#7C2433"/>
        <path d="M14 20c7 0 13 1.4 18 5v25c-5-3.6-11-5-18-5z" fill="#F4EFE6"/>
        <path d="M50 20c-7 0-13 1.4-18 5v25c5-3.6 11-5 18-5z" fill="#E9DFCC"/>
        <path d="M37 31.5c3.2-.9 6.6-1.3 9.6-1.3" stroke="#B0843A" stroke-width="2.6" stroke-linecap="round" fill="none"/>
        <path d="M37 37.5c3.2-.9 6.6-1.3 9.6-1.3" stroke="#C9B89A" stroke-width="1.8" stroke-linecap="round" fill="none"/>
      </svg>
      <div><h1>강단노트</h1><p>설교 원고를 읽고, 표시하고, 강단으로.</p></div>
    </div>
    <div class="lib-actions">
      <label class="search" id="searchBox" hidden><svg class="i"><use href="#i-search"/></svg><input id="q" type="search" placeholder="제목 찾기" autocomplete="off"></label>
      <div class="seg sort" id="sortSeg" hidden><button data-sort="recent">최근</button><button data-sort="date">설교 날짜</button></div>
      <button id="btnSelect" class="btn" hidden><svg class="i"><use href="#i-check"/></svg>원고 선택</button>
      <button id="btnImport" class="btn primary"><svg class="i"><use href="#i-plus"/></svg>원고 불러오기</button>
      <button id="btnSettings" class="icon-btn gear" aria-label="설정"><svg class="i"><use href="#i-gear"/></svg></button>
    </div>
  </header>
  <main id="grid" class="grid"></main>
  <div id="empty" class="empty" hidden>
    <svg class="art" viewBox="0 0 120 120" aria-hidden="true">
      <ellipse cx="60" cy="104" rx="40" ry="5" fill="#E2D9C8"/>
      <path d="M22 34c15 0 28 3 38 10v52c-10-7-23-10-38-10z" fill="#FBF8F2" stroke="#CFC3AE" stroke-width="1.5"/>
      <path d="M98 34c-15 0-28 3-38 10v52c10-7 23-10 38-10z" fill="#F1EADC" stroke="#CFC3AE" stroke-width="1.5"/>
      <path d="M30 52c7 0 14 1.4 22 4.4M30 61c7 0 14 1.4 22 4.4M30 70c7 0 14 1.4 18 3" stroke="#D5CAB6" stroke-width="2" stroke-linecap="round" fill="none"/>
      <path d="M68 57c6-2 13-3 22-3" stroke="#FFE45C" stroke-width="7" stroke-linecap="round" opacity=".9"/>
      <path d="M68 56.4c7-2.4 14-3 21-3M68 65.4c7-2.4 14-3 21-3M68 74.4c5-1.6 10-2.3 15-2.3" stroke="#C9BCA5" stroke-width="2" stroke-linecap="round" fill="none"/>
      <path d="M86 78l14-24 5 3-14 24-6 3z" fill="#7C2433"/>
    </svg>
    <h2>아직 불러온 원고가 없어요</h2>
    <p>설교 원고 PDF를 불러오면 여기 쌓여요.<br>애플펜슬로 표시하고, 강단에서는 탭 한 번으로 넘겨 보세요.</p>
    <div class="empty-actions">
      <button class="btn primary" data-act="import"><svg class="i"><use href="#i-plus"/></svg>PDF 불러오기</button>
      <button class="btn" data-act="sample"><svg class="i"><use href="#i-book"/></svg>사용 설명서 보기</button>
    </div>
    <button class="linkbtn" data-act="howto">한글 · 워드 원고를 PDF로 만드는 법</button>
  </div>
  <footer class="lib-foot" id="libFoot"></footer>
  <div class="libbar" id="libBar" hidden>
    <span class="cnt" id="lbCnt"></span>
    <button id="lbPast" hidden></button>
    <button id="lbAll">모두 고르기</button>
    <button id="lbDel" class="del" disabled>지우기</button>
    <button id="lbDone" class="done">완료</button>
  </div>
  <input id="file" type="file" accept="application/pdf,.pdf" multiple hidden>
  <input id="restoreFile" type="file" accept=".zip,application/zip" hidden>
</section>

<!-- 리더 -->
<section id="reader" class="view" data-mode="prep" data-theme="light" hidden>
  <header class="rbar" id="rbar">
    <button class="icon-btn" id="btnBack" aria-label="서재로"><svg class="i"><use href="#i-back"/></svg></button>
    <button class="icon-btn prep-only" id="btnThumbs" aria-label="쪽 미리보기"><svg class="i"><use href="#i-side"/></svg></button>
    <div class="rtitle prep-only"><b id="rTitle"></b><span id="rSub"></span></div>
    <div class="pstat pulpit-only">
      <button class="pill" id="pPage"><svg class="i"><use href="#i-pages"/></svg><span id="pPageTxt">1 / 1</span></button>
      <span class="grow"></span>
      <span class="pill clock" id="pClock"></span>
      <button class="pill timer" id="pTimer" aria-label="타이머 시작·멈춤"><span class="dot"></span><span class="tt" id="pTimerTxt">25:00</span><small id="pTimerSub">시작</small></button>
      <button class="pill tset" id="pTarget" aria-label="타이머 설정"><svg class="i"><use href="#i-timer"/></svg><span id="pTargetTxt">25분</span></button>
      <button class="pill autopill" id="autoBtn" aria-label="자동 스크롤"><svg class="i"><use href="#i-scroll"/></svg><span class="albl">자동</span><span class="adot"></span></button>
      <button class="pill" id="pTheme" aria-label="화면 밝기"><svg class="i"><use href="#i-moon"/></svg></button>
      <span class="pill wake off" id="pWake" title="화면 꺼짐 방지"><svg class="i"><use href="#i-lock"/></svg></span>
    </div>
    <div class="seg" id="modeSeg">
      <button data-mode="prep" class="on"><svg class="i"><use href="#i-pen"/></svg>준비</button>
      <button data-mode="pulpit"><svg class="i"><use href="#i-pulpit"/></svg>강단</button>
    </div>
    <button class="icon-btn" id="btnMenu" aria-label="메뉴"><svg class="i"><use href="#i-more"/></svg></button>
    <div class="tprog pulpit-only" id="tprog"></div>
  </header>

  <div class="rbody">
    <aside class="thumbs" id="thumbs" hidden><div id="thumbsList"></div></aside>
    <div class="scroller" id="scroller">
      <div class="pages" id="pages"></div>
      <div class="guide" id="guide"></div>
    </div>
  </div>

  <nav class="palette" id="palette">
    <button class="tool" data-tool="select" aria-label="고르기"><svg class="i"><use href="#i-lasso"/></svg></button>
    <button class="tool" data-tool="pen" aria-label="펜"><svg class="i"><use href="#i-pen"/></svg><span class="tip"></span></button>
    <button class="tool" data-tool="hl" aria-label="형광펜"><svg class="i"><use href="#i-hl"/></svg><span class="tip"></span></button>
    <button class="tool" data-tool="eraser" aria-label="지우개"><svg class="i"><use href="#i-eraser"/></svg></button>
    <span class="sep"></span>
    <div class="opts" id="opts"></div>
    <button class="size" id="btnSize" aria-label="굵기"><i></i><em></em></button>
    <span class="sep s2"></span>
    <button class="tool" id="btnUndo" aria-label="되돌리기"><svg class="i"><use href="#i-undo"/></svg></button>
    <button class="tool" id="btnRedo" aria-label="다시하기"><svg class="i"><use href="#i-redo"/></svg></button>
    <span class="sep"></span>
    <button class="tool finger" id="btnFinger" aria-label="손가락으로 쓰기"><svg class="i"><use href="#i-hand"/></svg></button>
  </nav>
  <div class="autobox pulpit-only" id="autoBox">
    <div class="autopanel" id="autoPanel" hidden>
      <button class="ab" id="aPlay" aria-label="멈춤"><svg class="i"><use href="#i-pause"/></svg></button>
      <button class="ab" id="aSlow" aria-label="느리게"><svg class="i"><use href="#i-minus"/></svg></button>
      <span class="aspd" id="aSpd">속도 9</span>
      <button class="ab" id="aFast" aria-label="빠르게"><svg class="i"><use href="#i-plus"/></svg></button>
      <button class="ab afit" id="aFit"><svg class="i"><use href="#i-timer"/></svg>시간에 맞추기</button>
      <button class="ab" id="aOff" aria-label="자동 스크롤 끄기"><svg class="i"><use href="#i-x"/></svg></button>
    </div>
  </div>
</section>

<script type="module" src="app.js"></script>
</body>
</html>
