</style></head><body><h1>먼저 무릎을 꿇는 사람</h1><p class="meta">본문: 다니엘 6:10 · 새벽기도회</p><hr><h2>1. 창문을 여는 사람</h2><p>다니엘은 금령이 내려진 것을 알고도 집에 돌아가 창문을 열었습니다. 전에 하던 대로 하루 세 번 무릎을 꿇었습니다.</p><p>그의 기도는 위기 때 갑자기 시작된 것이 아니라, 오래된 습관이었습니다.</p><h2>2. 전에 하던 대로</h2><p>위기의 날에 우리를 지키는 것은 그날의 결심이 아니라 평소의 무릎입니다.</p></body></html>
