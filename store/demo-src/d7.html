</style></head><body><h1>마른 뼈에 부는 바람</h1><p class="meta">본문: 에스겔 37:1-10 · 수요 기도회</p><hr><h2>1. 골짜기에 선 선지자</h2><p>하나님은 에스겔을 마른 뼈가 가득한 골짜기로 데려가셨습니다. 이 뼈들이 능히 살 수 있겠느냐 물으셨습니다.</p><h2>2. 말씀이 선포될 때</h2><p>말씀이 선포되자 뼈들이 서로 이어졌습니다. 절망의 골짜기도 말씀 앞에서는 새 생명의 자리가 됩니다.</p></body></html>
