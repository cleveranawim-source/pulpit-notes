</style></head><body><h1>광야에서 부르는 노래</h1><p class="meta">본문: 출애굽기 15:22-27 · 수요 기도회</p><hr><h2>1. 노래가 끝난 자리</h2><p>홍해를 건넌 이스라엘은 춤추며 노래했습니다. 그러나 노래가 끝나자마자 그들 앞에 펼쳐진 것은 사흘 길의 광야였습니다.</p><p>물이 없는 길을 걸으며 그들의 노래는 원망으로 바뀌었습니다. 우리의 믿음도 그렇게 쉽게 목이 마릅니다.</p><h2>2. 쓴 물 앞에서</h2><p>마라의 물은 썼습니다. 목마른 백성에게 쓴 물은 물이 없는 것보다 더 아픈 실망이었습니다.</p><p>그때 모세는 먼저 부르짖었습니다. 원망 대신 기도를 택한 한 사람이 광야의 방향을 바꿉니다.</p></body></html>
