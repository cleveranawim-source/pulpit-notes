</style></head><body><h1>작은 자에게 한 것</h1><p class="meta">본문: 마태복음 25:31-40 · 주일 낮 예배</p><hr><h2>1. 놀라는 사람들</h2><p>마지막 날, 칭찬받은 사람들은 오히려 놀랍니다. 우리가 언제 주님께 그렇게 했습니까?</p><p>그들은 선한 일을 기억하지 못했습니다. 사랑이 몸에 배어 있었기 때문입니다.</p><h2>2. 가장 작은 자의 얼굴</h2><p>주님은 가장 작은 자의 얼굴로 우리 곁에 오십니다. 오늘 우리가 스쳐 지나간 한 사람이 그분이었을지 모릅니다.</p></body></html>
