</style></head><body><h1>무너진 성벽 앞에서</h1><p class="meta">본문: 느헤미야 1:1-11 · 수요 기도회</p><hr><h2>1. 소식을 듣고 울다</h2><p>느헤미야는 예루살렘 성벽이 무너졌다는 소식을 듣고 앉아서 울었습니다. 그리고 여러 날 금식하며 기도했습니다.</p><h2>2. 우리의 죄를 고백하며</h2><p>그의 기도는 남을 탓하는 기도가 아니라, 나와 내 아버지의 집이 범죄하였다는 고백으로 시작했습니다.</p></body></html>
