</style></head><body><h1>아침마다 새로운</h1><p class="meta">본문: 예레미야애가 3:22-23 · 새벽기도회</p><hr><h2>1. 무너진 성에서 부른 노래</h2><p>예레미야는 폐허가 된 예루살렘에서 이 고백을 했습니다. 모든 것이 무너진 자리에서도 무너지지 않는 것이 있었습니다.</p><h2>2. 아침마다</h2><p>주님의 긍휼은 아침마다 새롭습니다. 어제의 실패가 오늘 아침의 은혜를 막지 못합니다.</p></body></html>
