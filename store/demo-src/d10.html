</style></head><body><h1>가르치는 자의 기도</h1><p class="meta">본문: 디모데후서 2:1-7 · 교직원 예배</p><hr><h2>1. 은혜 안에서 강하라</h2><p>바울은 디모데에게 은혜 안에서 강하라고 말합니다. 가르치는 자의 힘은 지식보다 은혜에서 나옵니다.</p><h2>2. 농부처럼</h2><p>수고하는 농부가 먼저 곡식을 받듯, 오늘 흘린 수고는 반드시 열매로 돌아옵니다.</p></body></html>
