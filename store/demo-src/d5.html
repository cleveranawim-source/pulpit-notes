</style></head><body><h1>길 위의 식탁</h1><p class="meta">본문: 누가복음 24:13-35 · 청년부 예배</p><hr><h2>1. 엠마오로 가는 길</h2><p>두 제자는 예루살렘을 등지고 걷고 있었습니다. 기대가 무너진 사람의 발걸음은 늘 무겁습니다.</p><p>그 길에 낯선 이가 함께 걸었습니다. 그들은 그분이 누구신지 알아보지 못했습니다.</p><h2>2. 떡을 떼실 때</h2><p>눈이 열린 곳은 설교를 듣던 길 위가 아니라, 함께 떡을 떼던 식탁이었습니다.</p></body></html>
