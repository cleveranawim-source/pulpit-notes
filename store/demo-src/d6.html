</style></head><body><h1>돌아온 아들의 식탁</h1><p class="meta">본문: 누가복음 15:11-24 · 주일 낮 예배</p><hr><h2>1. 먼 나라에서</h2><p>둘째 아들은 아버지의 재산을 들고 먼 나라로 떠났습니다. 자유를 찾아 떠난 길이었지만, 그 끝은 돼지 먹이조차 부러운 굶주림이었습니다.</p><h2>2. 아직 거리가 먼데</h2><p>아버지는 아들이 아직 멀리 있을 때 먼저 알아보고 달려갔습니다. 은혜는 늘 우리보다 먼저 달려옵니다.</p></body></html>
