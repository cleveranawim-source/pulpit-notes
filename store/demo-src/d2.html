</style></head><body><h1>기다림도 믿음입니다</h1><p class="meta">본문: 시편 40:1-3 · 주일 낮 예배</p><hr><h2>1. 기다리고 기다렸더니</h2><p>시인은 기다리고 또 기다렸다고 고백합니다. 한 번의 기다림이 아니라 여러 날, 어쩌면 여러 해의 기다림이었을 것입니다.</p><p>기다림은 아무것도 하지 않는 시간이 아닙니다. 기다림은 하나님이 일하실 자리를 비워 두는 믿음의 행동입니다.</p><h2>2. 귀를 기울이시는 하나님</h2><p>하나님은 멀리서 지켜보시는 분이 아니라, 몸을 기울여 우리 소리를 들으시는 분입니다.</p></body></html>
