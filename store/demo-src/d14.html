</style></head><body><h1>겨자씨만 한 믿음</h1><p class="meta">본문: 마태복음 17:14-20 · 주일 낮 예배</p><hr><h2>1. 고치지 못한 제자들</h2><p>제자들은 귀신 들린 아이를 고치지 못했습니다. 그들은 왜 우리는 할 수 없었느냐고 물었습니다.</p><h2>2. 작은 믿음, 큰 하나님</h2><p>주님은 믿음의 크기보다 믿음의 대상을 말씀하십니다. 겨자씨만 한 믿음도 크신 하나님께 닿으면 산을 옮깁니다.</p></body></html>
