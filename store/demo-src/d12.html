</style></head><body><h1>물 위를 걷는 한 걸음</h1><p class="meta">본문: 마태복음 14:22-33 · 청년부 예배</p><hr><h2>1. 바람이 부는 밤</h2><p>제자들은 거센 바람 속에서 밤새 노를 저었습니다. 그때 주님이 물 위로 걸어오셨습니다.</p><h2>2. 오라 하시니</h2><p>베드로는 배에서 내려 물 위를 걸었습니다. 바람을 볼 때 빠졌지만, 주님은 곧 손을 내밀어 붙잡으셨습니다.</p></body></html>
